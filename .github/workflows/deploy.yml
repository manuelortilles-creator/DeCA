name: Desplegar sitio en GitHub Pages

# El flujo se activa con cada push en la rama main
on:
  push:
    branches: ["main"]
  # Permite ejecutar este flujo manualmente desde la pestaña Actions
  workflow_dispatch:

# Establece los permisos necesarios para que GitHub Actions pueda publicar el sitio
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que se acumulen despliegues si subes muchos archivos seguidos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir los archivos (Artefacto)
        uses: actions/upload-pages-artifact@v3
        with:
          # Indica qué carpeta se va a publicar (el punto "." significa todo el repositorio)
          path: '.'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
